<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>初始化后台 · XGift</title>
<style nonce="__XGIFT_NONCE__">
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,sans-serif;background:light-dark(#f4f8fd,#0d1826);color:light-dark(#12314f,#e8f1fb)}main{max-width:560px;margin:8vh auto;padding:28px;background:light-dark(white,#14243a);border-radius:16px}h1{margin-top:0}label{display:block;margin:18px 0}input{display:block;width:100%;padding:12px;margin-top:6px;font:inherit;border:1px solid #789;border-radius:8px}button{padding:12px 20px;font:inherit;border:0;border-radius:8px;background:#1f6fb2;color:white;cursor:pointer}button:disabled{opacity:.6}a{color:inherit}#note{white-space:pre-wrap}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #4c9be0;outline-offset:3px}@media(max-width:600px){main{margin:20px 12px}}
</style>
</head>
<body><main>
<h1>设置后台密码</h1>
<p>只需建立管理员账号。X 登录凭据、支付卡、付款节点和商品价格，进入后台后再逐项设置。</p>
<form id="setup-form">
<label>初始化口令<input id="setup-password" type="password" autocomplete="off" required><small>使用服务器安装完成时显示的口令，验证这台站点属于你。</small></label>
<label>后台密码<input id="admin-password" type="password" autocomplete="new-password" required><small>32–256 UTF-8 字节，不能包含首尾空格、换行或空字符；建议使用密码管理器生成并保存。</small></label>
<label>确认后台密码<input id="admin-confirm" type="password" autocomplete="new-password" required></label>
<button id="submit" type="submit">创建管理员并进入后台</button>
</form>
<p id="note" role="status" aria-live="polite"></p>
<a id="admin-link" href="/admin" hidden>打开管理后台（用户名 admin）</a>
</main><script src="/setup.js" defer></script></body>
</html>
